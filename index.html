<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Raihan V - Official</title>
<style>
body{background:#f0f2f5;font-family:sans-serif;margin:0;padding:15px;display:flex;justify-content:center}
.box{background:#fff;width:100%;max-width:380px;padding:20px;border-radius:20px;box-shadow:0 4px 15px #ccc;text-align:center}
.btn{width:100%;padding:12px;margin:6px 0;border:none;border-radius:25px;color:#fff;font-weight:bold;cursor:pointer}
.r{background:#ff0000}.b{background:#1877f2}.g{background:#25D366}.black{background:#000}
.card{background:#f9f9f9;padding:12px;border-radius:12px;margin-top:12px;text-align:left}
.coin{font-size:24px;color:green;text-align:center;font-weight:bold}
.task{display:flex;justify-content:space-between;background:#fff;padding:8px;border-radius:8px;margin:5px 0;border-left:4px solid orange}
</style>
</head>
<body>
<div class="box">
<h2>Hi, I'm Raihan V 🚀</h2><p style="font-size:12px">Welcome to my official website</p>
<div style="background:orange;width:50px;height:50px;border-radius:50%;margin:0 auto;line-height:50px;font-weight:bold;color:#fff">R</div>
<p style="color:green;font-weight:bold">রায়হান Raihan Vai ❤️</p><p style="font-size:11px">raihan0192830@gmail.com</p>

<!-- আপনার আগের বাটন গুলো থাকবে -->
<button class="btn black">📥 Download My App</button>
<button class="btn b">Facebook</button>
<button class="btn r">YouTube</button>
<button class="btn g">WhatsApp</button>

<!-- নতুন সব ফিচার এখান থেকে শুরু -->
<div class="card" style="border:2px solid gold;text-align:center">
<div>🪙 আমার কয়েন</div><div class="coin" id="coin">0</div>
<div style="background:#ddd;height:10px;border-radius:10px"><div id="bar" style="background:green;height:10px;width:0%"></div></div>
<p id="wText" style="color:red;font-weight:bold;font-size:13px">Withdraw: OFF</p>
<button class="btn black" onclick="doWithdraw()">💸 Withdraw করুন</button>
</div>

<div class="card">
<h4>📋 কাজ করুন - কয়েন জিতুন</h4>
<div class="task"><span>ভিডিও দেখুন</span><button onclick="doTask(1,5)">+5</button></div>
<div class="task"><span>Follow করুন</span><button onclick="doTask(2,10)">+10</button></div>
<div class="task"><span>Invite করুন</span><button onclick="doTask(3,20)">+20</button></div>
</div>

<div class="card" style="background:#e8f5e9">
<h4>🔗 রেফার লিংক</h4>
<input id="refLink" style="width:90%;padding:8px" readonly>
<button class="btn g" style="padding:8px" onclick="shareLink()">শেয়ার করুন</button>
<p style="font-size:12px">আপনার লিংকে জয়েন: <b><span id="refCount">0</span> জন</b></p>
</div>

<div class="card" style="border:1px dashed red">
<h4>👑 Admin (শুধু আপনি)</h4>
<input type="password" id="apass" placeholder="01942" style="padding:8px;width:60%"><button onclick="adminLogin()">Login</button>
<div id="apanel" style="display:none;margin-top:8px">
<button onclick="setW(true)" style="background:green;color:#fff;padding:8px;border:none;border-radius:5px">Withdraw ON</button>
<button onclick="setW(false)" style="background:red;color:#fff;padding:8px;border:none;border-radius:5px">Withdraw OFF</button>
</div>
</div>

<button class="btn r" style="margin-top:10px">Logout</button>
<p style="font-size:10px">© 2025 Raihan V</p>
</div>

<script>
let coin=parseInt(localStorage.getItem('rc_coin')||0);let withdrawON=localStorage.getItem('rc_withdraw')=='true';let myId=localStorage.getItem('rc_id')||'Raihan'+Math.floor(Math.random()*999);localStorage.setItem('rc_id',myId);
function updateUI(){document.getElementById('coin').innerText=coin;document.getElementById('bar').style.width=Math.min(coin,100)+'%';document.getElementById('refLink').value=location.origin+location.pathname+'?ref='+myId;document.getElementById('refCount').innerText=localStorage.getItem('ref_'+myId)||0;if(withdrawON){document.getElementById('wText').innerText='Withdraw: ON';document.getElementById('wText').style.color='green';}}updateUI();
function doTask(id,r){if(localStorage.getItem('task_'+id)){alert('করা হয়েছে!');return;}coin+=r;localStorage.setItem('rc_coin',coin);localStorage.setItem('task_'+id,'done');updateUI();alert('+'+r+' কয়েন!');}
function doWithdraw(){if(!withdrawON){alert('Withdraw OFF আছে! Admin বন্ধ রেখেছে');return;}if(coin<100){alert('100 কয়েন লাগবে');return;}let n=prompt('Nagad Number:');if(n)alert('Request গেছে!');}
function shareLink(){window.open('https://wa.me/?text='+encodeURIComponent('আয় করুন: '+document.getElementById('refLink').value));}
function adminLogin(){if(document.getElementById('apass').value=='01942'){document.getElementById('apanel').style.display='block';alert('Welcome Boss!');}else alert('ভুল');}
function setW(o){localStorage.setItem('rc_withdraw',o);location.reload();}
</script>
</body>
</html>
